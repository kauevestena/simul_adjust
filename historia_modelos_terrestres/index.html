<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos Terrestres — Simulador Didático</title>
    <meta name="description" content="Simulador didático interativo mostrando a evolução dos modelos terrestres: da Terra plana à modelagem geodésica moderna com visualizações 3D.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <!-- Sidebar -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon">🌍</div>
            <h1>Modelos Terrestres</h1>
            <p class="subtitle">Simulador Didático</p>
        </div>
        <nav id="model-nav">
            <!-- Generated by app.js -->
        </nav>
        <div class="sidebar-footer">
            <p>Navegue pelos modelos para explorar a evolução do conhecimento sobre a forma da Terra.</p>
        </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content">
        <!-- 3D Viewport -->
        <div id="three-container">
            <canvas id="three-canvas"></canvas>
            <div id="model-title-overlay">
                <h2 id="current-model-name"></h2>
                <p id="current-model-subtitle"></p>
            </div>
        </div>

        <!-- Info Panel -->
        <div id="info-panel">
            <div class="info-panel-header" id="info-panel-header">
                <div class="info-tabs">
                    <button class="tab-btn active" data-tab="history" id="tab-btn-history">
                        <span class="tab-icon">📜</span>
                        <span class="tab-label">História</span>
                    </button>
                    <button class="tab-btn" data-tab="how" id="tab-btn-how">
                        <span class="tab-icon">⚙️</span>
                        <span class="tab-label">Como Funciona</span>
                    </button>
                    <button class="tab-btn" data-tab="interact" id="tab-btn-interact">
                        <span class="tab-icon">🎮</span>
                        <span class="tab-label">Interação</span>
                    </button>
                </div>
                <button id="toggle-panel" title="Expandir / Recolher painel">
                    <span class="toggle-icon">▼</span>
                </button>
            </div>
            <div class="info-content" id="info-content">
                <div id="tab-history" class="tab-pane active"></div>
                <div id="tab-how" class="tab-pane"></div>
                <div id="tab-interact" class="tab-pane"></div>
            </div>
        </div>
    </main>

    <!-- Figure Detail Modal -->
    <div id="figure-modal" class="modal-overlay">
        <div class="modal-content">
            <button class="modal-close" id="modal-close" title="Fechar">&times;</button>
            <div class="modal-body">
                <div class="modal-portrait-section">
                    <div class="modal-portrait-frame">
                        <img id="modal-portrait" class="modal-portrait" src="" alt="">
                    </div>
                    <h2 id="modal-name"></h2>
                    <p id="modal-years" class="modal-years"></p>
                </div>
                <div class="modal-text-section">
                    <div id="modal-description" class="modal-description"></div>
                    <div class="modal-illustration-wrapper" id="modal-illustration-wrapper">
                        <img id="modal-illustration" class="modal-illustration" src="" alt="">
                        <p id="modal-illustration-caption" class="modal-illustration-caption"></p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
