<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Simulador de Erro em Profundidade</title><link rel="stylesheet" href="style.css"></head><body>
<header><a id="portal" href="../">← Portal</a><div><button id="pt" lang="pt-BR">PT</button><button id="en" lang="en">EN</button></div></header>
<main><h1 data-t="title"></h1><p class="lead" data-t="intro"></p><div class="layout"><aside><h2 data-t="parameters"></h2><div id="controls"></div><label for="mode" data-t="geometry"></label><select id="mode"><option value="convergent" data-t="convergent"></option><option value="parallel" data-t="parallel"></option></select><button id="reset" data-t="reset"></button><p class="hint" data-t="sensorHint"></p></aside>
<div class="results"><div class="metrics" aria-live="polite"><section><span data-t="sigmaZ"></span><strong id="result"></strong><small data-t="oneSigma"></small></section><section><span data-t="angle"></span><strong id="angle"></strong><small id="ratio"></small></section><section><span data-t="focalPixels"></span><strong id="fpx"></strong><small id="pitch"></small></section></div>
<p id="warning" role="status"></p><section class="panel"><h2 data-t="plan"></h2><svg id="geometry" viewBox="0 0 760 330" role="img"></svg><p class="hint" data-t="planHint"></p></section>
<section class="panel"><h2 data-t="chartTitle"></h2><p class="legend"><span class="blue" data-t="parallel"></span> · <span class="orange" data-t="convergent"></span></p><svg id="chart" viewBox="0 0 760 320" role="img"></svg><p class="hint" data-t="chartHint"></p><button id="csv" data-t="export"></button></section>
<details class="panel"><summary data-t="theory"></summary><p data-t="explain"></p><p class="formula">fpx = f · N / W<br>σZ,∥ = √2 · σpx · Z² / (fpx · B)<br>σZ,↘↙ = √2 · σpx · (Z² + B²/4) / (fpx · B)</p><p data-t="definitions"></p><p data-t="limits"></p><p data-t="rotation"></p><a href="https://stereopipeline.readthedocs.io/en/stable/error_propagation.html" data-t="reference"></a></details>
</div></div></main><script type="module" src="app.mjs"></script></body></html>
