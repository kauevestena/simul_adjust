<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pré-análise de Redes Topográficas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 60 60'%3E%3Cpath d='M30 5L55 50H5Z' fill='%230d817e'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header><a class="portal" href="../" data-t="portal"></a><div class="heading"><span data-t="subtitle"></span><h1 data-t="title"></h1></div><div class="languages"><button data-lang="pt-BR">PT</button><button data-lang="en">EN</button></div><button id="help" data-t="help"></button></header>
  <div class="scenario-bar"><label><span data-t="level"></span><select id="level"><option value="0" data-t="plane"></option><option value="1" data-t="rural"></option></select></label><label><span data-t="examples"></span><select id="example"><option value="traverse" data-t="traverse"></option><option value="weak" data-t="weak"></option><option value="resection" data-t="resection"></option><option value="intersection" data-t="intersection"></option><option value="mixed" data-t="mixed"></option></select></label><span class="spacer"></span><button id="save" data-t="save"></button><button id="load" data-t="load"></button><input id="file" type="file" accept="application/json,.json" hidden><button id="toggle-panel" data-t="panel" aria-expanded="true"></button></div>
  <main id="workspace">
    <section class="canvas-area">
      <div class="tools" role="toolbar" data-label="network"><button data-tool="select" data-t="select"></button><button data-tool="station">+ <span data-t="station"></span></button><button data-tool="sighted_only">+ <span data-t="sighted_only"></span></button><button data-tool="sight">↗ <span data-t="sight"></span></button><button data-tool="delete" data-t="delete"></button><span class="tool-separator"></span><button id="undo" data-label="undo">↶</button><button id="redo" data-label="redo">↷</button><button id="fit" data-t="fit"></button></div>
      <div id="drawing"><canvas id="canvas" tabindex="0" data-label="network"></canvas><div id="canvas-caption"><strong id="canvas-level"></strong><span id="hint"></span></div><div id="canvas-legend"></div><div id="busy" role="status" hidden data-t="loading"></div></div>
      <div id="error" role="alert" hidden></div>
      <footer><div id="status"></div><div id="metrics"></div><div id="comparison" hidden></div></footer>
    </section>
    <aside id="inspector"><div class="inspector-heading"><h2 data-t="panel"></h2><button id="clear-selection" data-t="network"></button></div><div id="context"></div>
      <details id="instrument-section" open><summary data-t="instrument"></summary><label><select id="instrument"><option value="standard" data-t="standard"></option><option value="educational" data-t="educational"></option><option value="precise" data-t="precise"></option><option value="custom" data-t="custom"></option></select></label><div id="instrument-fields" class="fields two"></div><p class="note" data-t="formula"></p></details>
      <details><summary data-t="layers"></summary><div class="checks"><label><input id="labels" type="checkbox" checked><span data-t="labels"></span></label><label><input id="ellipses" type="checkbox" checked><span data-t="ellipses"></span></label><label><input id="precision-labels" type="checkbox"><span data-t="precisionLabels"></span></label><label><input id="redundancy-color" type="checkbox"><span data-t="redundancyColor"></span></label><label><input id="terrain-layer" type="checkbox" checked><span data-t="terrain"></span></label></div><label><span data-t="confidence"></span><select id="confidence"><option value="1sigma" data-t="oneSigma"></option><option value="95" data-t="confidence95"></option></select></label><label><span data-t="exaggeration"></span><input id="exaggeration" type="number" min="1" max="1000000" value="5000" step="100"></label></details>
      <details id="reliability-section"><summary data-t="reliability"></summary><div class="fields two"><label><span data-t="alpha"></span><input id="alpha" type="number" min="0.000001" max="0.2" step="0.001" value="0.001"></label><label><span data-t="power"></span><input id="power" type="number" min="0.5" max="0.9998" step="0.05" value="0.8"></label></div><p class="note" data-t="reliabilityNote"></p><button id="clear-effect" data-t="clearEffect"></button></details>
      <div class="panel-actions"><button id="baseline" data-t="compare"></button><button id="matrices" data-t="matrix"></button></div>
      <div id="terrain-note" hidden><p class="note" data-t="terrainCredit"></p><p class="note" data-t="terrainApprox"></p></div><p class="note" data-t="frameNote"></p><p class="note" data-t="level2Note"></p>
    </aside>
  </main>
  <dialog id="help-dialog"><div class="dialog-top"><h2 data-t="help"></h2><button data-close="help-dialog" data-t="close"></button></div><p data-t="helpBody"></p><p class="note" data-t="limitations"></p></dialog>
  <dialog id="matrix-dialog"><div class="dialog-top"><h2 data-t="matrix"></h2><button data-close="matrix-dialog" data-t="close"></button></div><p data-t="matrixHint"></p><label><select id="matrix-choice"><option>A</option><option>P</option><option>N</option><option>Σxx</option></select></label><p class="note" data-t="matrixLimited"></p><pre id="matrix-content"></pre><pre id="matrix-order"></pre><button id="matrix-save" data-t="matrixSave"></button></dialog>
  <script type="module" src="app.mjs"></script>
</body>
</html>
