<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GNSS Orbit Simulator</title>
    <!-- CesiumJS CSS -->
    <link href="https://unpkg.com/cesium@1.116.0/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link href="style.css" rel="stylesheet">
</head>
<body>
    <div id="cesiumContainer"></div>
    <div id="uiPanel" class="glass-panel">
        <div class="panel-header">
            <a href="../index.html" class="back-link" id="portalLink">← Portal</a>
            <div class="lang-switcher" role="group" aria-label="Language / Idioma">
                <button type="button" class="lang-btn active" data-lang="pt-BR">PT</button>
                <button type="button" class="lang-btn" data-lang="en">EN</button>
            </div>
        </div>
        <h1 id="appTitle">Simulador GNSS</h1>
        <div class="stats">
            <p><span id="labelActiveSats">Satélites Ativos:</span> <span id="satCount">0</span></p>
            <p style="margin-top: 4px; font-size: 0.9em; color: #a0aec0;"><span id="labelInView">Visíveis:</span> <span id="inViewCount">0</span></p>
        </div>
        <div class="controls">
            <label>
                <input type="checkbox" id="toggleOrbits" checked>
                <span id="labelShowOrbits">Mostrar Trajetórias Orbitais</span>
            </label>
            <label>
                <input type="checkbox" id="toggleLOS" checked>
                <span id="labelShowLOS">Mostrar Linhas de Visada (LOS)</span>
            </label>
        </div>
        <div class="dop-stats" style="margin-bottom: 16px; background: rgba(0, 0, 0, 0.3); padding: 12px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.05);">
            <h3 id="labelReceiverStatus" style="font-size: 1rem; margin: 0 0 8px 0; color: #a0aec0;">Status do Receptor</h3>
            <p id="receiverCoords" style="font-size: 0.85rem; margin: 0 0 8px 0; color: #a0aec0;">Clique no globo para posicionar o receptor.</p>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; font-size: 0.9rem;">
                <div><strong style="color:#a0aec0;">GDOP:</strong> <span id="gdopValue">--</span></div>
                <div><strong style="color:#a0aec0;">HDOP:</strong> <span id="hdopValue">--</span></div>
                <div><strong style="color:#a0aec0;">VDOP:</strong> <span id="vdopValue">--</span></div>
            </div>
        </div>
        <div class="sat-list-container">
            <h3 id="labelConstellations">Constelações</h3>
            <ul id="satList">
                <li id="loadingItem" class="loading">Carregando dados TLE...</li>
            </ul>
        </div>
    </div>

    <!-- Math.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.min.js"></script>
    <!-- Satellite.js -->
    <script src="https://unpkg.com/satellite.js@4.1.3/dist/satellite.min.js"></script>
    <!-- CesiumJS -->
    <script src="https://unpkg.com/cesium@1.116.0/Build/Cesium/Cesium.js"></script>
    <!-- App Logic -->
    <script src="app.js"></script>
</body>
</html>
