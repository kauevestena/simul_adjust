name: Channel Tunnel story checks
on:
  push:
    paths: ['channel_tunnel_story/**', 'index.html', 'camera_proj/vendor/**', '.github/workflows/channel-tunnel-story.yml']
  pull_request:
    paths: ['channel_tunnel_story/**', 'index.html', 'camera_proj/vendor/**', '.github/workflows/channel-tunnel-story.yml']
  workflow_dispatch:
# Superseded preview commits need not compete for software WebGL runners.
# Use one group for push and PR checks from the same branch.
concurrency:
  group: channel-tunnel-story-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  model-and-portal:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Numerical models, bilingual content and portal JavaScript parsing
        run: node --test channel_tunnel_story/tests/*.test.mjs
      - name: Existing simulator numerical regression checks
        run: |
          node --test camera_proj/tests/*.test.mjs erro_profundidade/tests/*.test.mjs
          node intersecao_re_3D/test_adjust.js
          node intersecao_re_3D/test_preproc.js
          node ajusta_planos/test_adjust.js
          node ajusta_planos/test_volume.js
          node test.js
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: channel_tunnel_story/package-lock.json
      - run: npm ci --prefix channel_tunnel_story
      - run: npx --prefix channel_tunnel_story playwright install --with-deps ${{ matrix.browser }}
      - name: Desktop and phone layouts, keyboard, i18n, real WebGL, calculations, offline and axe
        run: xvfb-run -a npm run test:browser --prefix channel_tunnel_story
        env:
          STORY_BROWSER: ${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-${{ matrix.browser }}-screenshots
          path: channel_tunnel_story/test-results/
  live-map:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: channel_tunnel_story/package-lock.json
      - run: npm ci --prefix channel_tunnel_story
      - run: npx --prefix channel_tunnel_story playwright install --with-deps chromium
      - name: Load real OpenFreeMap vector tiles and Terrarium elevations
        run: npm run test:live --prefix channel_tunnel_story
      - name: Existing camera and depth simulator browser regression
        run: |
          node camera_proj/tests/browser.cjs
          node erro_profundidade/tests/browser.cjs
        env:
          NODE_PATH: ./channel_tunnel_story/node_modules
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-live-map-screenshots
          path: channel_tunnel_story/test-results/
