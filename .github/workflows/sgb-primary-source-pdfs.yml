name: Verify SGB presentations / Verificar apresentações SGB
'on':
  push:
    branches: [fix/sgb-altimetry-primary-sources]
    paths:
      - .github/workflows/sgb-primary-source-pdfs.yml
      - sistemas_coordenadas/explanations/sgb_altimetria.tex
      - sistemas_coordenadas/explanations/sgb_altimetria_numeros.py
      - sistemas_coordenadas/explanations/test_sgb_altimetria_numeros.py
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sgb-altimetry-primary-sources
      - name: Install TeX and PDF tools / Instalar ferramentas
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq latexmk texlive-latex-extra texlive-science texlive-lang-portuguese lmodern poppler-utils python3-pil
      - name: Verify calculations / Verificar cálculos
        working-directory: sistemas_coordenadas/explanations
        run: |
          python3 -m unittest -v test_sgb_altimetria_numeros.py
          python3 sgb_altimetria_numeros.py
          python3 sgb_altimetria_numeros.py --figuras > /tmp/sgb-figures.tex
      - name: Build both languages / Compilar os dois idiomas
        working-directory: sistemas_coordenadas/explanations
        run: |
          latexmk -pdf -interaction=nonstopmode -halt-on-error sgb_altimetria.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error sgb_altimetria_en.tex
      - name: Validate and render all pages / Validar e renderizar páginas
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, shutil, subprocess
          import xml.etree.ElementTree as ET
          from PIL import Image, ImageDraw
          qa = Path("/tmp/sgb-qa")
          qa.mkdir(exist_ok=True)
          report = {}
          selected = [30,31,32,39,56,65,66,67,72,73,74,75,77,81,82,97,98,101,102,106,107,108,111,112,117,122,137,138,142,154,155,156,162,163,164,165]
          for name in ("sgb_altimetria", "sgb_altimetria_en"):
              pdf = Path("sistemas_coordenadas/explanations") / (name + ".pdf")
              bbox = qa / (name + ".html")
              subprocess.run(["pdftotext", "-bbox", str(pdf), str(bbox)], check=True)
              pages = ET.parse(bbox).getroot().findall(".//{*}page")
              assert len(pages) == 165, (name, len(pages))
              for i, page in enumerate(pages, 1):
                  words = page.findall(".//{*}word")
                  assert words, (name, i, "empty page")
                  width, height = float(page.attrib["width"]), float(page.attrib["height"])
                  for w in words:
                      x0, y0, x1, y1 = [float(w.attrib[k]) for k in ("xMin","yMin","xMax","yMax")]
                      assert x0 >= -0.1 and y0 >= -0.1 and x1 <= width+0.1 and y1 <= height+0.1, (name, i, w.text)
              renders = qa / name
              renders.mkdir(exist_ok=True)
              subprocess.run(["pdftoppm", "-scale-to", "900", "-png", str(pdf), str(renders / "page")], check=True)
              for batch in range(3):
                  subset = selected[batch*12:(batch+1)*12]
                  sheet = Image.new("RGB", (2700, 2120), "#dddddd")
                  for j, page_number in enumerate(subset):
                      image = Image.open(renders / ("page-%03d.png" % page_number)).convert("RGB")
                      image.thumbnail((900, 506))
                      ImageDraw.Draw(image).text((12, 480), "%s page %d" % (name, page_number), fill="red")
                      sheet.paste(image, ((j % 3)*900, (j // 3)*530))
                  sheet.save(qa / ("contact_%s_%d.png" % (name, batch+1)))
              shutil.copy2(pdf, qa / pdf.name)
              report[name] = {"pages": len(pages), "rendered": len(list(renders.glob("page-*.png"))), "outside_page_words": 0}
          (qa / "quality.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sgb-primary-source-review
          retention-days: 3
          path: |
            /tmp/sgb-qa/*.pdf
            /tmp/sgb-qa/contact*.png
            /tmp/sgb-qa/quality.json
      - name: Commit PDFs to review branch / Gravar PDFs na branch
        run: |
          git add -- sistemas_coordenadas/explanations/sgb_altimetria.pdf sistemas_coordenadas/explanations/sgb_altimetria_en.pdf
          if git diff --cached --quiet; then
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Regenerate verified SGB presentations (PT/EN)'
          git push origin HEAD:fix/sgb-altimetry-primary-sources
