<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistemas de Coordenadas — Simulador Didático de Geodésia</title>
    <meta name="description" content="Simulador didático interativo dos sistemas de coordenadas fundamentais para Geodésia: Geodésicas, Esféricas, Astronômicas, ECEF, ENU e Plano Topográfico Local.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- KaTeX for math rendering -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"
        onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true},{left: '$', right: '$', display: false}]});"></script>
    <link rel="stylesheet" href="style.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.164.1/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.164.1/examples/jsm/"
        }
    }
    </script>
</head>
<body>
    <!-- Sidebar -->
    <aside id="sidebar">
        <div class="sidebar-header">
            <div class="logo-icon">📐</div>
            <h1>Sistemas de Coordenadas</h1>
            <p class="subtitle">Geodésia Fundamental</p>
        </div>
        <nav id="model-nav">
            <!-- Generated by app.js -->
        </nav>
        <div class="sidebar-footer">
            <p>Explore os sistemas de coordenadas fundamentais utilizados na Geodésia e suas relações.</p>
        </div>
    </aside>

    <!-- Main Content -->
    <main id="main-content">
        <!-- 3D Viewport -->
        <div id="three-container">
            <canvas id="three-canvas"></canvas>
            <div id="model-title-overlay">
                <h2 id="current-model-name"></h2>
                <p id="current-model-subtitle"></p>
            </div>
            <!-- Coordinate readout overlay -->
            <div id="coord-readout"></div>
        </div>

        <!-- Info Panel -->
        <div id="info-panel">
            <div class="info-panel-header" id="info-panel-header">
                <div class="info-tabs">
                    <button class="tab-btn active" data-tab="concept" id="tab-btn-concept">
                        <span class="tab-icon">📐</span>
                        <span class="tab-label">Conceito</span>
                    </button>
                    <button class="tab-btn" data-tab="how" id="tab-btn-how">
                        <span class="tab-icon">⚙️</span>
                        <span class="tab-label">Como Funciona</span>
                    </button>
                    <button class="tab-btn" data-tab="interact" id="tab-btn-interact">
                        <span class="tab-icon">🎮</span>
                        <span class="tab-label">Interação</span>
                    </button>
                </div>
                <button id="toggle-panel" title="Expandir / Recolher painel">
                    <span class="toggle-icon">▼</span>
                </button>
            </div>
            <div class="info-content" id="info-content">
                <div id="tab-concept" class="tab-pane active"></div>
                <div id="tab-how" class="tab-pane"></div>
                <div id="tab-interact" class="tab-pane"></div>
            </div>
        </div>
    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
