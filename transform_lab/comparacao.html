<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>transform_lab · Comparação / Comparison</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <a class="portal" href="../" data-t="portal"></a>
  <nav>
    <a data-page="index.html" href="index.html" data-t="navSimulator"></a>
    <a data-page="teoria.html" href="teoria.html" data-t="navTheory"></a>
  </nav>
  <div class="heading"><span data-t="subtitle"></span><h1 data-t="cmp.title"></h1></div>
  <div class="languages" role="group" aria-label="Language"><button data-lang="pt-BR">PT</button><button data-lang="en">EN</button></div>
</header>

<main class="doc" style="max-width:1280px">
  <p data-t="cmp.intro"></p>
  <p class="note" id="datasetInfo"></p>

  <details class="card" open>
    <summary data-t="cmp.setup"></summary>
    <div class="body">
      <div class="row">
        <label class="field preset-row"><span data-t="cmp.preset"></span><select id="preset"></select></label>
        <button class="btn" id="applyPreset" data-t="cmp.apply"></button>
        <button class="btn secondary" id="useMain" data-t="cmp.useMain"></button>
      </div>
      <p class="note" id="presetDesc"></p>
      <div class="cmp-grid">
        <div><strong data-t="cmp.configA"></strong><p class="cfg-summary" id="sumA"></p><button class="btn secondary" id="editA" data-t="cmp.edit"></button></div>
        <div><strong data-t="cmp.configB"></strong><p class="cfg-summary" id="sumB"></p><button class="btn secondary" id="editB" data-t="cmp.edit"></button></div>
      </div>
      <div class="body" id="commonForm" style="padding:0"></div>
    </div>
  </details>

  <div class="messages" id="messages" role="status"></div>
  <h2 data-t="cmp.results" style="font-size:18px;margin:16px 0 8px"></h2>
  <div class="tablewrap"><table id="cmpTable"></table></div>

  <h2 data-t="cmp.plots" style="font-size:18px;margin:22px 0 8px"></h2>
  <div class="cmp-grid">
    <div><strong id="titleA2d"></strong><div class="plot" style="height:min(60dvh,560px)"><canvas id="canvasA"></canvas><div class="tooltip" id="tipA" hidden></div></div></div>
    <div><strong id="titleB2d"></strong><div class="plot" style="height:min(60dvh,560px)"><canvas id="canvasB"></canvas><div class="tooltip" id="tipB" hidden></div></div></div>
  </div>
  <p class="note" data-t="cmp.help2d"></p>
  <div class="cmp-grid" style="margin-top:14px">
    <div><strong data-t="cmp.histA"></strong><div class="plot" style="height:300px"><canvas id="histA"></canvas></div></div>
    <div><strong data-t="cmp.histB"></strong><div class="plot" style="height:300px"><canvas id="histB"></canvas></div></div>
  </div>
</main>

<dialog id="dlgA"><div class="dlg-head"><strong data-t="cmp.configA"></strong><button class="btn secondary" data-close="dlgA" data-t="cmp.close"></button></div><div class="dlg-body" id="formA"></div><div class="dlg-foot"><button class="btn" data-close="dlgA" data-t="cmp.close"></button></div></dialog>
<dialog id="dlgB"><div class="dlg-head"><strong data-t="cmp.configB"></strong><button class="btn secondary" data-close="dlgB" data-t="cmp.close"></button></div><div class="dlg-body" id="formB"></div><div class="dlg-foot"><button class="btn" data-close="dlgB" data-t="cmp.close"></button></div></dialog>
<script type="module" src="compare.mjs"></script>
</body>
</html>
