<style>
:root{color-scheme:dark;--bg:#070f1b;--card:#111d2b;--txt:#f4f7fa;--muted:#bbced9;--line:#304456;--mint:#6ae3d7;--gold:#ffc570}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.65 system-ui,-apple-system,Segoe UI,sans-serif}
a{color:var(--mint)}a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
button{font:inherit;cursor:pointer}.top{position:relative;z-index:5;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 24px;border-bottom:1px solid var(--line);background:#091421}
.top a{font-weight:750;text-decoration:none}.langs{display:flex;gap:4px}.langs button{border:1px solid var(--line);border-radius:8px;padding:6px 12px;background:#182638;color:var(--txt)}.langs button[aria-pressed=true]{background:var(--mint);color:#08232b}
.layout{display:grid;grid-template-columns:minmax(340px,42%) minmax(0,58%);align-items:start}.story{min-width:0;padding:0 clamp(18px,4vw,68px)}.eyebrow{letter-spacing:.16em;text-transform:uppercase;font-size:.74rem;color:var(--mint);font-weight:800}
.hero{min-height:72vh;display:flex;flex-direction:column;justify-content:center}.hero h1{font-size:clamp(2.7rem,5.2vw,5.5rem);line-height:1.05;letter-spacing:-.05em;margin:14px 0}.intro{max-width:640px;font-size:1.1rem;color:var(--muted)}.stats{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px}

.stage{position:sticky;top:0;height:calc(100dvh - 1px);overflow:hidden;background:#152638}#map{position:absolute;inset:0}.stage:after{content:"";pointer-events:none;position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,16,28,.1),transparent 60%,rgba(4,16,28,.65))}

.stageHead strong{display:block;font-size:1rem}.stageHead small{color:#e4eff3}.status{color:var(--gold);font-size:.8rem}.legend{position:absolute;z-index:3;bottom:18px;left:20px;right:20px;max-width:510px;background:rgba(9,23,35,.95);border:1px solid #496377;border-radius:16px;padding:16px;box-shadow:0 12px 38px #02091280}
.legend h3{margin:0 0 4px;font-size:1.04rem}.legend p{margin:6px 0 12px;font-size:.83rem;color:#dbe4e8}.control{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.control label{font-size:.85rem}.control input{flex:1;min-width:100px;accent-color:var(--mint)}.value{font:700 1rem ui-monospace,monospace;color:var(--mint)}

.maplibregl-ctrl-bottom-right{margin-bottom:270px}
@media(max-width:850px){.layout{display:flex;flex-direction:column}.stage{order:-1;position:sticky;top:0;height:42dvh;width:100%;z-index:2}.story{width:100%;padding:0 22px}.hero{min-height:40vh}.chapter{min-height:62vh;padding:70px 0}.stageHead{top:8px;left:8px;padding:7px 10px;font-size:.83rem}.stageHead small{display:none}.legend{bottom:7px;left:8px;right:8px;max-width:none;padding:8px 12px}.legend h3{font-size:.82rem}.legend p,.legend .footnote{display:none}.legend .control{gap:6px}.legend #modelOutput{font-size:1rem}.maplibregl-ctrl-bottom-right{display:none}.top{padding:9px 12px}}

<script type="module">
import { lateralErrorMeters, illustrativeRoute, PORTALS } from "./model.mjs";
const refs=[
["Institution of Civil Engineers","The Channel Tunnel","https://www.ice.org.uk/what-is-civil-engineering/infrastructure-projects/the-channel-tunnel"],
["C. E. Calvert (1989), Survey Review","GPS observations and the Channel Tunnel","https://doi.org/10.1179/sre.1989.30.231.3"],
["BRGM","1986: BRGM and the Channel Tunnel","https://histoire.brgm.fr/en/instants/1986-brgm-and-channel-tunnel"],
["N. Korittke (1991), TRID","Accuracy of the Eurotunnel breakthrough","https://trid.trb.org/View/1011750"],
["Warren & Varley (1992), TRID","Geotechnical monitoring to breakthrough","https://trid.trb.org/View/375986"],
["CIRIA C671 (2009), case study 13","Structural monitoring strategy for the Channel Tunnel","https://www.apmgs.ro/files/documente/CIRIA_report_C671_Tunnells_inspection_as1.pdf"],
["Eurotunnel / LeShuttle","The history of the Channel Tunnel","https://www.leshuttle.com/uk-en/discover/why-choose-leshuttle/build/the-channel-tunnel"],
["Geological Society of London","Channel Tunnel","https://www.geolsoc.org.uk/science-and-policy/100-great-geosites/industrial-and-economic-importance/channel-tunnel/"]
];
const ui={
pt:{overline:"Uma história de geodésia aplicada",mainTitle:"Sob o Canal da Mancha",subtitle:"Como medições, referenciais e controle geométrico tornaram possível construir o Eurotúnel — do projeto à operação.",statTotal:"extensão total",statSea:"sob o mar",statOpen:"inauguração",referencesTitle:"Fontes e rastreabilidade",sourcesContext:"Cada capítulo remete às fontes indicadas. A linha em planta é um esquema entre portais aproximados, não um levantamento do eixo real.",mapTitle:"Canal da Mancha · perspectiva 3D",mapCaveat:"Linha esquemática entre portais, NÃO o eixo do túnel. O modelo de terreno mostra a superfície, não a profundidade escavada.",mapStatus:"Mapa externo requer conexão",mapFallback:"Mapa indisponível. Os capítulos e o experimento continuam acessíveis.",labTitle:"Experimente: erro de orientação",labText:"Um único erro angular hipotético, propagado ao longo de um trecho reto.",angleLabel:"Erro angular",distanceLabel:"Extensão",labCaveat:"Modelo didático isolado. Não reproduz as poligonais nem explica a discrepância real de 358 mm em planta.",units:"desvio lateral",lesson:"Ideia-chave"},
en:{overline:"A story of applied geodesy",mainTitle:"Beneath the Channel",subtitle:"How measurements, reference systems and geometric control made the Channel Tunnel possible — from planning to operation.",statTotal:"total length",statSea:"under the sea",statOpen:"opening",referencesTitle:"Sources and provenance",sourcesContext:"Each chapter cites its supporting sources. The plan-view line joins approximate portals; it is not an as-built tunnel alignment.",mapTitle:"English Channel · 3D perspective",mapCaveat:"Approximate portal chord, NOT the surveyed tunnel centreline. Terrain is the surface, not the excavation depth.",mapStatus:"External map requires connectivity",mapFallback:"Map unavailable. Chapters and the learning experiment remain accessible.",labTitle:"Try it: bearing uncertainty",labText:"One hypothetical bearing error propagated along a straight segment.",angleLabel:"Bearing error",distanceLabel:"Length",labCaveat:"Standalone teaching model. This is not the historical traverse computation and does not explain the actual 358 mm horizontal breakthrough difference.",units:"lateral offset",lesson:"Takeaway"}
};
const C=[
{id:"challenge",year:"1802–1986",progress:0,camera:[1.47,51.01,9.0,52,-22],src:[1,7,8],pt:["A ideia e o desafio","Como ligar dois países sob o mar?","Planos de ligação fixa remontam ao século XIX. O projeto realizado compreende duas galerias ferroviárias e uma galeria central de serviço, ao longo de cerca de 50,45 km. A obra deveria avançar de margens opostas sem linha de visada direta entre elas.","Como definir a mesma posição, altura e direção em duas margens?"],en:["The idea and the challenge","How can two nations meet underground?","Fixed-link proposals date back to the nineteenth century. The completed project comprises two railway tunnels and a central service tunnel, extending about 50.45 km. Construction had to advance from opposite shores without a direct sightline between them.","How can teams on opposite shores share position, elevation and direction?"]},
{id:"control",year:"1986–1987",progress:.12,camera:[1.33,51.05,10.1,58,-42],src:[2],pt:["Referência geodésica","Uma rede comum para dois países","A Ordnance Survey foi contratada em 1986 para criar uma grade de projeto; o IGN observou o setor francês e realizou cálculo independente da rede completa. Observações GPS reforçaram essa rede em 1987. Não bastava reunir coordenadas nacionais: era necessário um sistema coerente para engenharia.","Rede de apoio, datum, projeção e ajustamento por mínimos quadrados."],en:["Geodetic framework","One control network for two countries","Ordnance Survey was commissioned in 1986 to create a dedicated project grid; IGN observed the French side and independently computed the full network. GPS observations strengthened the network in 1987. National coordinates alone were not sufficient: the project needed one coherent engineering reference.","Control network, datum, projection and least-squares adjustment."]},
{id:"geology",year:"1986–1988",progress:.23,camera:[1.58,50.98,10,65,25],src:[3,8],pt:["Conhecer o subsolo","O traçado depende da geologia","O BRGM processou aproximadamente 1.500 km de perfis sísmicos e 50 mil pontos geofísicos para apoiar a modelagem dos estratos. A escavação buscava o calcário margoso favorável. Geofísica e geologia caracterizaram o maciço; referências espaciais e levantamentos conectaram esse conhecimento ao traçado.","Geodésia e geologia são disciplinas distintas, mas complementares."],en:["Exploring the ground","The geology shapes the alignment","BRGM worked with roughly 1,500 km of seismic profiles and 50,000 geophysical points to model rock layers. Excavation sought favourable marly chalk. Geophysics and geology characterised the ground; spatial control connected that information to the planned alignment.","Geodesy and geology are different but complementary disciplines."]},
{id:"underground",year:"1987–1990",progress:.45,camera:[1.36,51.035,10.4,68,40],src:[2,4],pt:["Controle subterrâneo","Levar a orientação para dentro da rocha","Sem céu visível para posicionamento por satélite, poligonais subterrâneas propagavam coordenadas, distâncias e direções. Giroteodolitos forneciam verificações independentes de azimute. Erros de orientação, refração e propagação de incertezas exigiam medições redundantes e ajuste da rede.","Um erro angular pequeno pode tornar-se significativo após dezenas de quilômetros."],en:["Underground control","Bringing orientation into the rock","With no sky view for satellite positioning, underground traverses transferred coordinates, distances and directions. Gyro-theodolites independently checked azimuth. Bearing uncertainty, refraction and error propagation required redundant measurement and network adjustment.","A tiny angular error matters over tens of kilometres."]},
{id:"excavation",year:"1987–1991",progress:.7,camera:[1.48,51.005,10.2,65,-38],src:[1,5],pt:["Execução","Onze tuneladoras e duas frentes","Seis tuneladoras partiram do Reino Unido e cinco da França. A galeria de serviço avançou primeiro, ajudando a reconhecer o terreno à frente das galerias principais. O controle topográfico orientava o avanço e sondagens e observações geotécnicas informavam decisões durante a escavação.","Locação geométrica e monitoramento do terreno têm finalidades complementares."],en:["Construction","Eleven TBMs approaching each other","Six tunnel-boring machines worked from the UK and five from France. The service tunnel advanced first, improving knowledge of the ground ahead of the railway bores. Geometric surveying guided excavation while probing and geotechnical observations informed construction decisions.","Geometric setting-out and ground monitoring have complementary roles."]},
{id:"breakthrough",year:"1 DEC 1990",progress:1,camera:[1.47,51.01,11.2,68,18],src:[1,4,7],pt:["O encontro","358 mm em planta, 58 mm em altura","A galeria de serviço conectou as frentes em 1º de dezembro de 1990. A Institution of Civil Engineers relata 358 mm de discrepância horizontal e 58 mm vertical. Outras publicações dão valores horizontais ligeiramente diferentes. A discrepância no encontro não equivale à precisão de cada observação individual.","Compare a medida relatada com o experimento, mas não confunda os modelos."],en:["The breakthrough","358 mm horizontally, 58 mm vertically","The service tunnel connected both drives on 1 December 1990. The Institution of Civil Engineers reports a 358 mm horizontal and 58 mm vertical difference at breakthrough. Other technical sources give slightly different horizontal values. This difference is not the precision of any individual measurement.","Compare the reported result with the experiment, but do not confuse the models."]},
{id:"monitoring",year:"1994 →",progress:1,camera:[1.69,50.97,10,52,-18],src:[5,6,7],pt:["Monitoramento e operação","A geodésia continua depois do encontro","O Eurotúnel foi inaugurado em 6 de maio de 1994. Durante a obra, monitoraram-se condições geológicas, infiltração e escavação. Na operação, programas coordenados de inspeção e monitoramento dos revestimentos apoiam a avaliação de integridade estrutural. A comparação geométrica entre épocas ilustra o papel de referências estáveis — sem representar dados reais de deformação da estrutura.","Medir repetidamente em um mesmo referencial permite identificar mudanças."],en:["Monitoring and operation","Geodesy continues after breakthrough","The Channel Tunnel opened on 6 May 1994. During construction, teams monitored geological conditions, water ingress and excavation. In service, coordinated inspection and lining-monitoring programmes support structural-integrity management. Comparing geometry between epochs illustrates the value of a stable reference — without claiming access to real deformation readings.","Repeated surveys in a stable frame make change observable."]}
];
let lang="pt", active=0, map=null, routeReady=false, observer=null;
const $=id=>document.getElementById(id);
function initialLang(){const p=new URLSearchParams(location.search).get("lang");if(p==="en")return"en";if(p==="pt"||p==="pt-BR")return"pt";try{const v=localStorage.getItem("monorepo_lang");if(v==="en")return"en";if(v==="pt"||v==="pt-BR")return"pt"}catch{}return navigator.language?.toLowerCase().startsWith("pt")?"pt":"en"}
function updateRoute(p){if(!map||!routeReady)return;map.getSource("route").setData({type:"Feature",geometry:{type:"LineString",coordinates:illustrativeRoute(p)},properties:{}})}
function setActive(index){active=index;document.querySelectorAll("#chapterNav button").forEach((b,i)=>b.setAttribute("aria-current",i===index?"step":"false"));const c=C[index];updateRoute(c.progress);if(map){const [lng,lat,zoom,pitch,bearing]=c.camera;map.flyTo({center:[lng,lat],zoom,pitch,bearing,duration:matchMedia("(prefers-reduced-motion: reduce)").matches?0:1650,essential:false})}}
function setLang(next){lang=next;const t=ui[lang];document.documentElement.lang=lang==="pt"?"pt-BR":"en";try{localStorage.setItem("monorepo_lang",lang==="pt"?"pt-BR":"en")}catch{}const u=new URL(location);u.searchParams.set("lang",lang);history.replaceState(null,"",u);$("back").href="../?lang="+lang;$("pt").setAttribute("aria-pressed",String(lang==="pt"));$("en").setAttribute("aria-pressed",String(lang==="en"));
for(const key of ["overline","mainTitle","subtitle","statTotal","statSea","statOpen","referencesTitle","sourcesContext","mapTitle","mapCaveat","mapStatus","labTitle","labText","angleLabel","distanceLabel","labCaveat"])$(key).textContent=t[key];$("mapFallback").textContent=t.mapFallback;document.title=t.mainTitle+" · simul_adjust";
$("chapterNav").replaceChildren();$("chapters").replaceChildren();
C.forEach((c,i)=>{const txt=c[lang];const b=document.createElement("button");b.type="button";b.textContent=(i+1).toString().padStart(2,"0");b.title=txt[1];b.addEventListener("click",()=>$("chapter-"+c.id).scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"instant":"smooth"}));$("chapterNav").append(b);
const section=document.createElement("article");section.className="chapter";section.id="chapter-"+c.id;section.innerHTML='<div class="year">'+c.year+'</div><div class="eyebrow"></div><h2></h2><p></p><div class="lesson"></div><div class="sources-mini"></div>';section.querySelector(".eyebrow").textContent=txt[0];section.querySelector("h2").textContent=txt[1];section.querySelector("p").textContent=txt[2];section.querySelector(".lesson").textContent=t.lesson+": "+txt[3];section.querySelector(".sources-mini").textContent=(lang==="pt"?"Fontes: ":"Sources: ")+c.src.map(x=>"["+x+"]").join(" ");$("chapters").append(section)});
$("sourcesList").replaceChildren();refs.forEach(([author,title,url])=>{const li=document.createElement("li"),a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=author+": "+title;li.append(a);$("sourcesList").append(li)});
if(observer)observer.disconnect();observer=new IntersectionObserver(entries=>{const visible=entries.filter(e=>e.isIntersecting).sort((a,b)=>b.intersectionRatio-a.intersectionRatio);if(visible.length){const i=C.findIndex(c=>"chapter-"+c.id===visible[0].target.id);if(i>=0)setActive(i)}},{rootMargin:"-25% 0px -43% 0px",threshold:[0,.15,.5]});document.querySelectorAll(".chapter").forEach(el=>observer.observe(el));setActive(active);updateModel()}
function updateModel(){const a=Number($("angle").value),d=Number($("distance").value);$("angleValue").textContent=a+"″";const metres=lateralErrorMeters(d,a);$("modelOutput").textContent=metres.toLocaleString(lang==="pt"?"pt-BR":"en",{minimumFractionDigits:3,maximumFractionDigits:3})+" m"}
$("angle").addEventListener("input",updateModel);$("distance").addEventListener("change",updateModel);$("pt").addEventListener("click",()=>setLang("pt"));$("en").addEventListener("click",()=>setLang("en"));setLang(initialLang());
function startMap(){if(!window.maplibregl){$("mapFallback").style.display="flex";return}
try{map=new maplibregl.Map({container:"map",style:"https://tiles.openfreemap.org/styles/positron",center:[1.47,51.01],zoom:9,pitch:52,bearing:-22,attributionControl:true});map.addControl(new maplibregl.NavigationControl({showCompass:true}),"top-right");
map.on("load",()=>{map.addSource("route",{type:"geojson",data:{type:"Feature",geometry:{type:"LineString",coordinates:illustrativeRoute(0)},properties:{}}});map.addLayer({id:"route-line",type:"line",source:"route",paint:{"line-color":"#e26335","line-width":6,"line-opacity":.9}});routeReady=true;for(const [k,color] of [["uk","#f6c46a"],["fr","#6ae3d7"]])new maplibregl.Marker({color}).setLngLat(PORTALS[k]).addTo(map);updateRoute(C[active].progress);
try{map.addSource("terrain",{type:"raster-dem",tiles:["https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png"],encoding:"terrarium",tileSize:256,maxzoom:13});map.setTerrain({source:"terrain",exaggeration:1.6})}catch(e){console.warn("Terrain unavailable; keeping map",e)}});
map.on("error",e=>console.warn("Map source warning",e.error));
}catch(e){console.warn("Could not start map",e);$("mapFallback").style.display="flex"}}
if(document.readyState==="complete")startMap();else window.addEventListener("load",startMap,{once:true});
</script>
